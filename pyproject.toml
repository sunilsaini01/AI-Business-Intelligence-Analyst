[project]
name = "ai-business-intelligence-agent"
version = "0.1.0"
description = "LangGraph-orchestrated agentic BI analyst with a critic-verified, evidence-traced report pipeline."
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
